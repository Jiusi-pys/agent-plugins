name: Validate Fenbi exporter
on:
  push:
    paths: ['plugins/fenbi-exporter/**', '.agents/plugins/marketplace.json', '.github/workflows/validate-fenbi-exporter.yml']
  pull_request:
    paths: ['plugins/fenbi-exporter/**', '.agents/plugins/marketplace.json', '.github/workflows/validate-fenbi-exporter.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r plugins/fenbi-exporter/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s plugins/fenbi-exporter/tests -v
