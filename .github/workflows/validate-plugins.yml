name: Validate Plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.270
      - name: Test workflow line endings
        # Regression includes a fresh Git checkout with core.autocrlf=true.
        run: node --test tests/workflow-line-endings.test.cjs
      - name: Validate marketplace and plugins
        shell: bash
        run: |
          set -euo pipefail
          claude plugin validate .
          for dir in plugins/*/; do
            claude plugin validate "$dir"
          done
